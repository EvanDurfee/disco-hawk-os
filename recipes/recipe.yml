---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: disco-hawk
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 42 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: bling
    install:
      - dconf-update-service

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        # Userspace sensor support
        - lm_sensors
        # Shell and system tools
        - git-credential-libsecret
        - distrobox
        - zsh
        - ripgrep
        - fd-find
        - bat
        - git-delta
        - fzf
        - btop
        - fastfetch
        - wireguard-tools
        - micro
        - rclone
        - restic
        - tmux
        - wl-clipboard
        - kitty
        # Gaming
        - steam-devices

        - mozilla-openh264
        # Shell extension
        - gnome-shell-extension-user-theme
        - gnome-shell-extension-caffeine
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-just-perfection
        - gnome-shell-extension-blur-my-shell
      exclude:
        - gnome-tour
    remove:
      packages:
        - fedora-bookmarks
        - fedora-chromium-config
        - fedora-chromium-config-gnome
        - fedora-flathub-remote
        - fedora-workstation-repositories
        # Extensions
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        # Replace system monitor with MissionCenter
        - gnome-system-monitor
        - gnome-tour
   # Default Flatpaks is disabled for now, until I can determine why it fails on fedora rebase.
  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        repo:
          title: Flathub (system)
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter
          - com.mattjakeman.ExtensionManager
          - org.altlinux.Tuner
          - com.usebottles.bottles
          - org.gnome.Boxes
          - org.gnome.Papers
          - org.libreoffice.LibreOffice
          - org.onlyoffice.desktopeditors
          - org.gimp.GIMP
          - com.valvesoftware.Steam
          - com.heroicgameslauncher.hgl
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks
          - com.discordapp.Discord
#      - scope: user # Also add Flathub user repo, but no user packages
#  - type: systemd
#    system:
#      enabled: system-flatpak-setup.timer

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
